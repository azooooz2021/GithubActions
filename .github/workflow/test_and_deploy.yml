name: Test

on: push


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name:  tests
      run: npm test

    - name: Deploy
      uses: actions/checkout@v4
      run : |
      echo "Deploying to production"
     
        
